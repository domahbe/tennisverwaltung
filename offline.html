<!doctype html>
<html lang="de">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Offline – TC Grün-Weiß</title>
    <style>
      body {
        font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text', sans-serif;
        background: #f5f5f7;
        color: #1d1d1f;
        display: flex;
        align-items: center;
        justify-content: center;
        min-height: 100dvh;
        margin: 0;
        text-align: center;
      }
      @media (prefers-color-scheme: dark) {
        body {
          background: #000;
          color: #f5f5f7;
        }
      }
      .ball {
        font-size: 64px;
      }
      h1 {
        font-size: 24px;
        margin: 16px 0 8px;
      }
      p {
        color: #6e6e73;
        font-size: 15px;
      }
      button {
        margin-top: 20px;
        background: #007aff;
        color: #fff;
        border: 0;
        border-radius: 14px;
        padding: 12px 28px;
        font-size: 16px;
        font-weight: 600;
      }
    </style>
  </head>
  <body>
    <div>
      <div class="ball">🎾</div>
      <h1>Du bist offline</h1>
      <p>Keine Internetverbindung.<br />Deine letzten Daten sind weiterhin verfügbar.</p>
      <button onclick="location.reload()">Erneut versuchen</button>
    </div>
  </body>
</html>
